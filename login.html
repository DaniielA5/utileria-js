<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale-1.0">
        <title>Login  - UTILERIA JS</title>
        
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <form id="formLogin">
            <label>Correo</label>
            <input type="email" id="LoginCorreo" placeholder="123@gmail.com">
            <span id="errorLo_Correo" class="error"></span>

            <label>Contrasena</label>
            <input type="contrasena" id="loginContrasena" placeholder="* * * * ..">
            <span id="fortalezaContrasena"></span>
            <span id="errorLoginContrasena" class="error"></span>

            <button type="submit">Ingresar</button>
        </form>
        <p id="mensajeLogin"></p>

        <script src="js/utileria.js"></script>
        <script>
            const inputContrasena = 
            document.getElementById("LoginContrasena");
            const spanFortaleza = 
            document.getElementById("FortaContrasena");

            inputContrasena.addEventListener("input", function() {
                spanFortaleza.textContent= "Fortaleza: " + medirFortaContrasena(inputContrasena.value);
            });

            document.getElementById("formLogin").addEventListener("submit",
            function (event) {
                event.prevetDefault();
                const correo =document.getElementById("loginCorreo").value;
                const contrasena = inputContrasena.value;
                let valido = true;

                document.getElementById("errorLoginCorreo").textContent =validarCorreo(correo) ? "" : "Correo invalido";
                if(!validarCorreo(correo)) valido = false;

                document.getElementById("errorLoginContrasena").textContent = validarContrasena(contrasena) ? "": "Nop cumple los requesitos";
                if(!validarContrasena(contrasena)) valido =  false;

                document.getElementById("mensajeLogin").textContent = valido ? "Login exitoso" : "";

            });

        </script>

    </body>
</html>

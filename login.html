<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Utileria JS</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/utileria.js"></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <form id="formLogin" novalidate>
        <h1>Iniciar sesión</h1>

        <label for="loginCorreo">Correo</label>
        <input type="email" id="loginCorreo" placeholder="123@gmail.com">
        <span id="errorLoginCorreo" class="error"></span>

        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword">
       
        <span id="errorLoginPassword" class="error"></span>

        <button type="submit">Iniciar sesión</button>
        <p class="cambio">¿No tienes cuenta? <a href="index.html">Regístrate</a></p>
    </form>
    <p id="mensajeLogin"></p>

</body>
</html>

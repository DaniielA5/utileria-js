<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Utileria JS</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/utileria.js"></script>
    <script src="js/index.js" defer></script>

</head>
<body>
    <form id="formPrincipal" novalidate>
        <h1>Registro</h1>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Emanuel">
        <span id="errorNombre" class="error"></span>

        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="123@gmail.com">
        <span id="errorCorreo" class="error"></span>

        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input type="date" id="fechaNacimiento">
        <span id="errorFecha" class="error"></span>

        <label for="codigoPostal">Código postal (máx 5 dígitos)</label>
        <input type="text" id="codigoPostal" placeholder="68000">
        <span id="errorCodigo" class="error"></span>

        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" placeholder="9511234567">

        <label for="password">Contraseña</label>
        <input type="password" id="password">
        <div class="barra"><div id="barraFortaleza"></div></div>
        <span id="textoFortaleza" class="texto-fortaleza"></span>
        <span id="errorPassword" class="error"></span>

        <button type="submit">Registrarme</button>
        <p class="cambio">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </form>

    <dialog id="modalEdad">
        <h2>¡Registro exitoso!</h2>
        <p>Hola, <strong id="nombreResultado"></strong></p>
        <p>Tu edad es: <strong id="edadResultado"></strong></p>
        <p>¿Mayor de edad? <strong id="mayorEdadResultado"></strong></p>
        <p>Teléfono formateado: <strong id="telefonoResultado"></strong></p>
        <button id="cerrarModal">Cerrar</button>
    </dialog>

   
</body>
</html>
